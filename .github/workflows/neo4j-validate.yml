# Neo4j CI — Validate & Test
# Lints Cypher, boots Neo4j Enterprise as a service container, seeds schema/data, runs pytest.
name: Neo4j CI — Validate & Test

on:
  pull_request:
    branches: [main]
  push:
    paths:
      - "cypher/**"
      - "python/**"
      - "tests/**"
      - "ci/.github/workflows/neo4j-validate.yml"

env:
  NEO4J_URI: bolt://localhost:7687
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: testpassword1234
  NEO4J_DATABASE: neo4j

jobs:
  lint-cypher:
    name: Lint Cypher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cypher-lint
        run: pip install cypher-lint

      - name: Lint all .cypher files
        run: |
          set -euo pipefail
          find cypher/ -name "*.cypher" -print0 | while IFS= read -r -d '' f; do
            echo "Linting $f"
            cypher-lint --strict "$f"
          done

  test:
    name: Integration tests
    needs: lint-cypher
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.23-enterprise
        env:
          NEO4J_AUTH: neo4j/testpassword1234
          NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
          NEO4J_PLUGINS: '["apoc","graph-data-science"]'
          NEO4J_server_memory_heap_max__size: 1g
          NEO4J_server_memory_pagecache__size: 512m
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 60s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r python/requirements.txt

      - name: Install cypher-shell
        run: |
          set -euo pipefail
          # Official Neo4j tarball provides cypher-shell without a full server install
          curl -fsSL -o /tmp/neo4j.tgz https://dist.neo4j.org/neo4j-community-5.23.0-unix.tar.gz
          tar -xzf /tmp/neo4j.tgz -C /tmp
          echo "/tmp/neo4j-community-5.23.0/bin" >> "$GITHUB_PATH"

      - name: Wait for Neo4j Bolt (max 60s)
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if cypher-shell -a bolt://localhost:7687 -u neo4j -p testpassword1234 "RETURN 1;" >/dev/null 2>&1; then
              echo "Neo4j is ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Neo4j did not become ready within 60s" >&2
          exit 1

      - name: Apply constraints and indexes
        run: |
          set -euo pipefail
          cypher-shell -a bolt://localhost:7687 -u neo4j -p testpassword1234 \
            --file cypher/00_constraints_indexes.cypher

      - name: Verify constraints ONLINE
        run: |
          set -euo pipefail
          OUT=$(cypher-shell -a bolt://localhost:7687 -u neo4j -p testpassword1234 --format plain \
            "SHOW CONSTRAINTS YIELD name, state RETURN name, state;")
          echo "$OUT"
          if echo "$OUT" | grep -v '^name' | grep -v '^$' | grep -v ONLINE; then
            echo "One or more constraints are not ONLINE" >&2
            exit 1
          fi

      - name: Apply sample data
        run: |
          set -euo pipefail
          cypher-shell -a bolt://localhost:7687 -u neo4j -p testpassword1234 \
            --file cypher/01_sample_data.cypher

      - name: Verify data counts
        run: |
          set -euo pipefail
          OUT=$(cypher-shell -a bolt://localhost:7687 -u neo4j -p testpassword1234 --format plain \
            "MATCH (n) RETURN labels(n)[0] AS label, count(n) AS cnt ORDER BY label;")
          echo "$OUT"
          echo "$OUT" | grep -E 'Employee[[:space:]]+10' || { echo "Expected 10 Employees" >&2; exit 1; }
          echo "$OUT" | grep -E 'Application[[:space:]]+5' || { echo "Expected 5 Applications" >&2; exit 1; }
          echo "$OUT" | grep -E 'Incident[[:space:]]+8' || { echo "Expected 8 Incidents" >&2; exit 1; }
          echo "$OUT" | grep -E 'Department[[:space:]]+3' || { echo "Expected 3 Departments" >&2; exit 1; }

      - name: Run pytest
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: testpassword1234
        run: |
          set -euo pipefail
          # Testcontainers-based suite needs Docker; GHA runners provide it.
          # Session fixtures boot Neo4j 5.23 Enterprise (may run alongside the service).
          pytest tests/ -v --tb=short --junit-xml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  migration-order-check:
    name: Migration filename order
    needs: lint-cypher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify sequential migration versions
        run: |
          python <<'PY'
          import glob
          import os
          import re
          import sys

          files = sorted(glob.glob("cypher/migrations/*.cypher"))
          files = [f for f in files if not f.endswith(".gitkeep") and os.path.isfile(f)]
          if not files:
              print("No migration files present; order check skipped (OK).")
              sys.exit(0)

          # Expected: vMAJOR.MINOR.PATCH__description.cypher (rollback files end with __rollback.cypher)
          pat = re.compile(r"^v(\d+)\.(\d+)\.(\d+)__(.+)\.cypher$")
          versions = []
          for path in files:
              name = os.path.basename(path)
              if name.endswith("__rollback.cypher"):
                  continue
              m = pat.match(name)
              if not m:
                  print(f"Invalid migration filename (need vX.Y.Z__name.cypher): {name}", file=sys.stderr)
                  sys.exit(1)
              versions.append((int(m.group(1)), int(m.group(2)), int(m.group(3)), name))

          versions.sort()
          if not versions:
              print("Only rollback files found; forward migration order check skipped (OK).")
              sys.exit(0)

          # Sequential by patch within a linear list: no duplicate versions; sorted == declared order
          seen = set()
          prev = None
          for ver in versions:
              key = ver[:3]
              if key in seen:
                  print(f"Duplicate migration version: {ver[3]}", file=sys.stderr)
                  sys.exit(1)
              seen.add(key)
              if prev is not None:
                  # Require strictly increasing version tuples (no gaps in sorted unique list
                  # when using consecutive patch numbers from the first)
                  if key <= prev:
                      print(f"Non-increasing version order at {ver[3]}", file=sys.stderr)
                      sys.exit(1)
                  # Gap check on patch when major.minor equal
                  if key[0] == prev[0] and key[1] == prev[1] and key[2] != prev[2] + 1:
                      print(
                          f"Gap in patch versions between {prev} and {key} ({ver[3]})",
                          file=sys.stderr,
                      )
                      sys.exit(1)
              prev = key

          print("Migration order OK:")
          for v in versions:
              print(f"  {v[3]}")
          PY
