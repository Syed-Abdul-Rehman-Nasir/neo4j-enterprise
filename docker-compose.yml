# Neo4j Enterprise development environment
#
# Start:  docker-compose up -d
# Stop:   docker-compose down
# Reset:  docker-compose down -v
#         Then delete local ./neo4j/data (and ./neo4j/logs, ./neo4j/import, ./neo4j/plugins if needed)

services:
  neo4j:
    image: neo4j:5.23-enterprise
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 4g
      NEO4J_server_memory_heap_max__size: 4g
      NEO4J_server_memory_pagecache_size: 2g
      NEO4J_server_metrics_prometheus_enabled: "true"
      NEO4J_server_metrics_prometheus_endpoint: 0.0.0.0:2004
      NEO4J_db_logs_query_enabled: INFO
      NEO4J_db_logs_query_threshold: 2000ms
      NEO4J_db_transaction_timeout: 60s
    ports:
      - "7474:7474"
      - "7687:7687"
      - "2004:2004"
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/plugins:/plugins
      - ./neo4j/backups:/backups
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - neo4j

  api:
    build:
      context: .
      dockerfile: python/api/Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme_use_vault_in_prod}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      API_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      API_READ_ONLY: "true"
      PROMETHEUS_URL: http://prometheus:9090
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      prometheus:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "8080:80"
    depends_on:
      - api
