# Prometheus scrape config for Neo4j Enterprise metrics.
# Mounted by docker-compose at: /etc/prometheus/prometheus.yml
# Neo4j exposes Prometheus metrics on port 2004 (server.metrics.prometheus.endpoint).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: neo4j
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['neo4j:2004']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
    # Keep only metric families used by dashboards, alerts, and the metrics catalog:
    #   db_page_cache  — hit ratio widget / page-cache alerts
    #   jvm            — heap utilization / GC widgets
    #   db_query       — latency p50/p95/p99 timeseries
    #   db_transaction — active tx + throughput widgets
    #   cluster        — unreachable members + replication lag alerts
    #   bolt           — connection open/close dashboard widgets
    #   ids_in_use     — node/relationship cardinality catalog metrics
    #   db_store       — store size growth widget
    #   db_checkpoint  — checkpoint duration catalog metric
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'neo4j_(db_page_cache|jvm|db_query|db_transaction|cluster|bolt|ids_in_use|db_store|db_checkpoint).*'
        action: keep
